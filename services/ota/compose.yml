services:
  ota:
    build:
      context: ../..
      dockerfile: services/ota/Dockerfile
    environment:
      COURSE_ID: learning-cyber-security
      COURSE_TIER: "00"
      COURSE_ENVIRONMENT_ID: ${COURSE_ENVIRONMENT_ID:?run ./course setup}
      COURSE_BIND: 0.0.0.0
      COURSE_ALLOW_CONTAINER_WILDCARD: "1"
      COURSE_PORT: "8080"
      COURSE_STATE_DIR: /data
      COURSE_RELEASE_DIR: /releases
    ports:
      - "${COURSE_BIND:-127.0.0.1}:${COURSE_PORT:-8080}:8080"
    read_only: true
    volumes:
      - ../../.course-state/ota:/data:Z
      - ../../artifacts/generated/releases:/releases:ro,Z
    healthcheck:
      test: ["CMD", "/ota", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5
    security_opt:
      - no-new-privileges:true
