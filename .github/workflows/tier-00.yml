name: Tier 0

on:
  pull_request:
  push:
    branches:
      - implementation/first-release

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 -m pip install -r requirements.txt
      - run: ./scripts/verify-tier-00.sh
      - name: Hardware status
        run: |
          echo "ESP32-C6 flash: pending"
          echo "ESP32-C6 serial: pending"
          echo "Altered-image execution: pending"

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./course setup --runtime docker
      - run: ./course service start
      - run: ./course service status
      - run: ./course attack run tier-00/plaintext-inspection --execute tier-00/plaintext-inspection
      - run: ./course attack run tier-00/device-id-spoofing --execute tier-00/device-id-spoofing
      - run: ./course attack run tier-00/service-impersonation --execute tier-00/service-impersonation
      - run: ./course attack run tier-00/altered-image --execute tier-00/altered-image
      - if: always()
        run: ./course service stop

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zephyr host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake device-tree-compiler file g++-multilib gcc-multilib \
            gperf libmagic1 libsdl2-dev make ninja-build python3-dev \
            python3-tk python3-venv wget xz-utils
      - name: Provision pinned workspace
        run: |
          export ZEPHYR_WORKSPACE="$GITHUB_WORKSPACE/../zephyr-v4.4.2"
          python3 -m venv "$ZEPHYR_WORKSPACE/.venv"
          "$ZEPHYR_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip west
          "$ZEPHYR_WORKSPACE/.venv/bin/west" init \
            -m https://github.com/zephyrproject-rtos/zephyr.git \
            --mr v4.4.2 \
            "$ZEPHYR_WORKSPACE"
          cd "$ZEPHYR_WORKSPACE"
          "$ZEPHYR_WORKSPACE/.venv/bin/west" update hal_espressif mcuboot mbedtls tf-psa-crypto
          "$ZEPHYR_WORKSPACE/.venv/bin/west" packages pip --install
          "$ZEPHYR_WORKSPACE/.venv/bin/west" zephyr-export
          "$ZEPHYR_WORKSPACE/.venv/bin/west" blobs fetch hal_espressif
          cd "$ZEPHYR_WORKSPACE/zephyr"
          "$ZEPHYR_WORKSPACE/.venv/bin/west" sdk install \
            --version 1.0.1 \
            --install-dir "$ZEPHYR_WORKSPACE/zephyr-sdk-1.0.1" \
            --gnu-toolchains riscv64-zephyr-elf
      - name: Build pinned ESP32-C6 sysbuild
        run: |
          ZEPHYR_WORKSPACE="$GITHUB_WORKSPACE/../zephyr-v4.4.2" \
            ./scripts/build-zephyr-baseline.sh
      - name: Hardware status
        run: |
          echo "ESP32-C6 flash: pending"
          echo "ESP32-C6 serial: pending"
          echo "Altered-image execution: pending"
