# The host build of Tier 8's Time floor, for native_sim/native/64.
#
# What the three firmware files need, and nothing that reaches a network.
# The mbedTLS and PSA choices follow the Tier 8 prj.conf, including
# CONFIG_MBEDTLS_HAVE_TIME_DATE=n: the floor's comparison,
# mbedtls_x509_time_cmp(), does not depend on it, and a host build that turned
# it on would be judging with a clock the board does not have.
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_JSON_LIBRARY=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=n
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_USE_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# Records 4 and 5 live in the settings NVS instance, as they do on the board.
# native_sim's flash simulator holds the storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
