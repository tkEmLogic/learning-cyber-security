CONFIG_PRINTK=y
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_REBOOT=y

# Wi-Fi station and IPv4. Tier 2 speaks HTTPS to one literal address and checks
# the certificate against a name, so it still needs no name resolution. The
# name is compared, never looked up, and there is no resolver in this image.
#
# Tier 4 fetches two more objects over that same connection, the Release
# manifest and its detached signature. Verifying the manifest does not make an
# unverified connection acceptable, so nothing here is relaxed.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=8

CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y

# TLS for the update and status connection.
#
# CONFIG_MBEDTLS is already on in Tier 0, because the Wi-Fi driver needs it.
# Tier 2 adds the socket layer, the credential store, and one ciphersuite.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=49152
# A TLS record can be 16 KiB, and the peer decides how big it makes one.
#
# This was 2048 while Tier 3 was being built, because every response Tier 2
# had ever fetched over TLS was a small JSON record that fitted. Tier 3 is the
# first tier to download a firmware image over the verified connection, and the
# Go service sends that in full sized records. The client cannot hold one,
# mbedTLS treats it as fatal, and the socket layer returns -ECONNABORTED before
# a single byte reaches the flash writer.
#
# The symptom is misleading: "ota.request failed err=-113" after a handshake
# the same log line says succeeded. Nothing in the failure mentions buffers.
#
# Tier 2 now sets 16384 for the same reason. See issue #62.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# The trust anchor is compiled in as DER, so the PEM parser is not needed.
#
# Tier 4 adds a second compiled-in key, the release manifest verification key,
# and it stays off for that too. The build strips it to a bare 65-byte EC point
# that PSA imports directly. Measured on issue #65: turning PEM parsing back on
# costs 1696 bytes of .text and 228 of .flash.rodata to do at run time what the
# build does for free, and puts a text parser on the path to a trust decision.
CONFIG_MBEDTLS_PEM_PARSE_C=n

# Verifying the Release manifest needs no new Kconfig symbol at all.
#
# psa_hash_compute, mbedtls_ecdsa_der_to_raw, psa_import_key and
# psa_verify_hash are already linked into the untouched Tier 3 image, pulled in
# by two lines nobody set for this purpose: the ciphersuite above selects
# PSA_WANT_ALG_ECDSA, PSA_WANT_ALG_SHA_256 and the ECC key types and implies
# PSA_WANT_ECC_SECP_R1_256, and CONFIG_NET_SOCKETS_SOCKOPT_TLS does
# "select PSA_CRYPTO". psa_crypto_init() is already called from Zephyr's own
# SYS_INIT.
#
# The two lines below are assertions, not requests. They are already y, they
# change no bytes, and they are here so that a future change to the ciphersuite
# fails the build rather than quietly removing a verifier. release_policy.c
# carries the same statement as compile-time #error probes, because a symbol
# being set is not the same as a driver being present.
#
# Do not reach for CONFIG_MBEDTLS_ECDSA_C, CONFIG_MBEDTLS_ECP_C or
# CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED. This tree is Mbed TLS 4.1.0 with the
# separate tf-psa-crypto module and those symbols do not exist here; curves and
# algorithms are selected only through PSA_WANT_*.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# Certificate validity dates are deliberately not checked.
#
# This board has no real-time clock. With CONFIG_MBEDTLS_HAVE_TIME_DATE=y and
# no time source the clock reads 1970, every certificate is "not yet valid",
# and every handshake fails forever. The option is orthogonal to chain and name
# checking, so leaving it off costs neither of those.
#
# The consequence is real and belongs in the Weakness ledger: this device would
# accept an expired certificate. Tier 8 is where credential lifetime becomes
# the subject.
CONFIG_MBEDTLS_HAVE_TIME_DATE=n

# Reading the verification flags after a refusal, so the device can say which
# check failed instead of only that something did.
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# Writing the downloaded image into the secondary slot and asking MCUboot to
# swap it in. Tier 0 deliberately added no check here at all; Tier 4 decides
# whether to write before the transfer starts, and whether to request the swap
# after the bytes have been hashed.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# The course network may publish the same name on 2.4 GHz and 5 GHz. Scanning
# every channel makes the board pick the 2.4 GHz radio it can actually use.
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# Tier 5: the storage partition's first use in this course.
#
# The 192 KiB storage partition at 0x3b0000 has been in the pinned flash map
# since Tier 0 and no tier has ever written to it. Tier 5 needs somewhere for
# the download progress record and the trial failure count to survive a power
# cut, and this is what that partition is for.
#
# NVS directly rather than the settings subsystem. Settings is built on NVS
# here, so it is a layer of ergonomics over a record with four fields, and in
# the one tier whose subject is what survives a power cut a Learner is better
# served by seeing the write that matters.
CONFIG_NVS=y

# Tier 5: the watchdog that resets a trial image which hangs before it can
# report failure.
#
# Nothing in firmware/ has ever set this, and the esp32 driver actively
# disables the hardware during its own init, so the watchdog is off until an
# application turns it on and calls wdt_setup(). An image that hangs on a board
# with no watchdog running looks exactly like a control working.
#
# Read the COURSE_TRIAL_HANG help text before assuming this catches every hang.
# It does not, and what it misses is in the Tier 5 ledger.
CONFIG_WATCHDOG=y

# Reading back the image from the secondary slot to hash it.
#
# Tier 4 hashed the bytes as they streamed past, which a resumable download
# cannot do: after a power cut the hash state is gone, and persisting SHA-256
# midstate would be a great deal of unpleasantness for no gain. Tier 5 hashes
# the slot once the transfer completes instead.
#
# That is strictly the better check. Tier 4's comment says the digest protects
# the upgrade request, and hashing the slot makes that true of what is actually
# in the flash rather than of what the device believes it wrote.
CONFIG_FLASH_PAGE_LAYOUT=y

# Tier 6: a device identity key generated on the board.
#
# PSA_WANT_ALG_ECDSA and PSA_WANT_ECC_SECP_R1_256 are already on above, from
# Tier 4's manifest verification. Generating a key rather than only verifying
# with one needs the keypair types as well.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY is not optional and it fails silently.
#
# MBEDTLS_PK_MAX_PUBKEY_RAW_LEN is defined as 0 without it (pk.h:91) and that
# constant sizes a buffer in every PK context, so the failure is a zero length
# public key rather than a build error. It is currently on in some builds only
# as a side effect of the Wi-Fi driver's WPA3 option, which is not something to
# depend on. Measured on issue #108.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# Writing a certification request. MBEDTLS_X509_CSR_WRITE_C selects nothing at
# all, and the CSR writer calls mbedtls_pk_write_pubkey_der(), which is
# compiled out without MBEDTLS_PK_WRITE_C. Both are named here rather than one
# being assumed to imply the other.
#
# MBEDTLS_PEM_WRITE_C is deliberately absent. The request goes over the wire as
# DER. Turning PEM writing on would partly reverse the size decision Tier 5
# made and explained when it set CONFIG_MBEDTLS_PEM_PARSE_C=n.
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_X509_USE_C=y

# Storing the private key, in the exact configuration section 8 fixes.
#
# Read the limitation with it. The AEAD key is SHA-256 over a device identifier
# and the entry uid, and on this part that identifier is six bytes of the
# factory MAC: a value the device broadcasts in every Wi-Fi frame and which
# esptool read-mac prints over the same cable used to dump the flash. This
# encrypts the key at rest against casual inspection and detects unauthenticated
# changes. It is not a protected root secret, it does not prevent record replay,
# and it does not protect the key from privileged firmware, a debugger, or a
# capable flash attacker.
#
# Zephyr says so itself at boot, and the course leaves that warning switched on:
#   WARNING: Using a potentially insecure PSA ITS encryption key provider.
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_IMPLEMENTATION_AEAD=y
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_SCHEME_AES_GCM=y
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_KEY_PROVIDER_DEVICE_ID_HASH=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# The device identifier the key provider hashes comes from hwinfo.
CONFIG_HWINFO=y

# Settings, which the ITS store writes through, and which brings its own NVS
# instance on the storage partition.
#
# Tier 5 mounted its own nvs_fs at the first byte of that same partition and
# explained at length why it chose NVS over settings. Both land on the same
# bytes and nothing detects it: nvs_mount() checks write block size, sector
# size and a count of at least two, and nothing else, so both mounts return 0
# and the damage does not wait for a write.
#
# Tier 6 keeps Tier 5's raw records and its reasoning, and stops mounting a
# second instance. recovery_state.c now writes through the instance settings
# already owns, reached with settings_storage_get(). The entry id spaces do not
# overlap: settings uses 0x8000 and above, Tier 5 uses 1, 2 and 3. Measured on
# issue #109, decided on issue #120.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# The provisioning interface.
#
# SHELL_MINIMAL is the load-bearing line. Without it KERNEL_SHELL is default y
# and implies INIT_STACKS, THREAD_MONITOR, THREAD_NAME and THREAD_STACK_INFO,
# so a plain CONFIG_SHELL=y would hand anyone with the cable thread
# introspection and a reboot command. Every one of those, and the built-in
# commands, history, tab completion and VT100 handling, is gated on the same
# !SHELL_MINIMAL condition, so one symbol turns the lot off and anything
# upstream adds the same way stays off too.
#
# SHELL_AUTOSTART is off so the application chooses when the shell runs.
# shell_init() still runs at boot from the backend; AUTOSTART only decides
# whether it calls shell_start() for you (shell.c:1369).
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_BACKEND_SERIAL=y

# The provisioning shell's own thread, and the buffers around it.
#
# Every one of these three was found on the board, and each produced a failure
# that looked like something else.
#
# SHELL_STACK_SIZE defaults to 2048. Enrollment runs the entire certification
# request on this thread: loading the persistent PSA key out of Secure Storage
# decrypts an AES-GCM record through settings and NVS, and the CSR writer then
# encodes and signs. That overran 2 KiB and the symptom was an illegal
# instruction at an address in SRAM with a call trace pointing into gcm_mask,
# which reads like a fault inside the crypto library rather than like a stack
# that ran out. It is neither: it is a return address overwritten by the frame
# below it.
CONFIG_SHELL_STACK_SIZE=8192

# A stack that runs out should say so instead of jumping to whatever the data
# happened to be. The sentinel is checked on every context switch and turns the
# failure above into a named panic. It is here because the failure it names
# cost a debugging session, and because an unprovisioned board in front of a
# Learner is exactly where this path runs.
CONFIG_STACK_SENTINEL=y

# The station sends the issued certificate over this console. The command
# buffer defaults to 128 bytes, which is shorter than the certificate.
CONFIG_SHELL_CMD_BUFF_SIZE=256

# The serial backend's receive ring defaults to 64 bytes. The shell thread does
# not drain it fast enough when a host writes a long line in one go, and the
# first attempt at enrollment lost characters out of the middle of a 64
# character credential and acted on the corrupted text. Nothing reported the
# loss: a dropped character is not an error, it is simply a different command.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
