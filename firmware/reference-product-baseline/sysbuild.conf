SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# The course uses swap-using-offset in every tier.
#
# MCUboot copies the candidate from the secondary slot into the primary slot
# one sector at a time and keeps the displaced image, so a fallback path
# physically exists from Tier 0 onward. No tier before Tier 5 uses it: the
# application asks for a permanent upgrade, which makes the swap final as soon
# as it completes. Tier 5 is where the device learns to boot a candidate on
# trial and go back.
#
# The mode needs no scratch area. The scratch partition stays defined and
# unused in dts/esp32c6_4m_flash_map.dtsi so the pinned flash map does not move.
#
# The mode is selected here explicitly rather than left to the default that
# follows from an absent scratch node. A control that depends on a default is a
# control nobody can see.
#
# An earlier version of this file said swap modes hung on this board. They did,
# along with overwrite-only: the cause was esp_restart() leaving the BBPLL
# running so MCUboot hung configuring a PLL that was already on. The fix is
# course_reset_system() in src/main.c. See docs/esp32c6-build-baseline.md.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
