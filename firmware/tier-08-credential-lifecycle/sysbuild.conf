SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Sysbuild is told there is no signing, and that is deliberate.
#
# Sysbuild has one setting for a signing key, and it feeds two different jobs.
# The bootloader runs "imgtool getpub" on it, which needs only the public half.
# The application build runs "imgtool sign" on it, which needs the private
# half. One value cannot be both, and pointing it at the private key would name
# the Release signing key in a firmware build command, which
# docs/fixture-safety-contract.md forbids in as many words.
#
# So the two jobs are split, and so are the builds. This setting keeps the
# application image unsigned, exactly as Tier 0 and Tier 2 build it today, and
# the bootloader sysbuild produces here is discarded. Tier 4 needs the split
# for a second reason as well: its bootloader turns on downgrade prevention by
# security counter, which sysbuild's bootloader here knows nothing about. The bootloader that ships
# is built separately from bootloader/mcuboot.conf, which names only the public
# half, so no firmware build command ever names the Release signing key.
#
# The two bootloaders were compared: the separately built one resolves to a
# byte-identical Kconfig and the same 47,872 byte binary, so nothing is lost by
# building it outside sysbuild.
#
# Signing is a step the Learner runs afterwards, with the private key, on an
# image the build has already finished with.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# The course uses swap-using-offset in every tier. See Tier 0 and Tier 2 for
# the reasoning, which Tier 4 does not change.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
