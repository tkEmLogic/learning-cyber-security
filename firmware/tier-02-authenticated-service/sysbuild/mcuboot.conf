CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_FLASH_SIZE=4194304
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
# CONFIG_MCUBOOT_DOWNGRADE_PREVENTION is not set
# CONFIG_MCUBOOT_SERIAL is not set

# Without this MCUboot logs nothing at all, so a failed install is invisible on
# the console. Info level shows the Learner the bootloader accepting an image
# and overwriting the running one.
#
# Minimal log mode is deliberate. The deferred default buffers messages and
# loses them when the bootloader stops, and immediate mode does not link on
# this target.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_MINIMAL=y
