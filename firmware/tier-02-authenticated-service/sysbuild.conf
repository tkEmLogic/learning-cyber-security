SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Tier 0 overwrites the running image instead of swapping it.
#
# Both swap modes were tried first on this board and both hung inside MCUboot
# once an upgrade was pending: the bootloader printed its flash banner and
# stopped, and the board only recovered by a manual reset back into the old
# image. Overwrite-only needs no scratch area and no per-sector bookkeeping.
#
# It also states the Tier 0 posture honestly. There is no test boot and no way
# back: whatever the service sends becomes the running image. Recoverable
# installation is Tier 5.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
