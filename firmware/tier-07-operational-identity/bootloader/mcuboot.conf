# The Tier 4 bootloader, built on its own rather than by sysbuild.
#
# See sysbuild.conf for why the bootloader and the application are built
# separately. The short version: sysbuild has one setting for the signing key
# and it feeds both "imgtool getpub" for the bootloader and "imgtool sign" for
# the application. The bootloader needs only the public half, so building it
# here means no firmware build command ever names the Release signing key.
#
# Building outside sysbuild means the settings sysbuild would have injected
# have to be stated here instead. Each block below says which.

# From BOOTLOADER_image_default.cmake: the upgrade mode, stated explicitly and
# with every other mode turned off, exactly as sysbuild does it.
CONFIG_BOOT_SWAP_USING_OFFSET=y
# CONFIG_SINGLE_APPLICATION_SLOT is not set
# CONFIG_BOOT_SWAP_USING_SCRATCH is not set
# CONFIG_BOOT_UPGRADE_ONLY is not set
# CONFIG_BOOT_SWAP_USING_MOVE is not set
# CONFIG_BOOT_DIRECT_XIP is not set
# CONFIG_BOOT_RAM_LOAD is not set
# CONFIG_BOOT_FIRMWARE_LOADER is not set
# CONFIG_SINGLE_APPLICATION_SLOT_RAM_LOAD is not set

# Tier 3's control, unchanged. The key file names the public half only, and
# ./course build firmware writes it from the Learner's own key.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The same settings Tier 0 and Tier 2 give the bootloader.
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_FLASH_SIZE=4194304
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
# CONFIG_MCUBOOT_SERIAL is not set
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_MINIMAL=y

# Tier 4's control, and the one that actually stops a downgrade.
#
# MCUBOOT_DOWNGRADE_PREVENTION alone compares versions. With
# MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER it compares the candidate's
# IMAGE_TLV_SEC_CNT against the counter in the image already sitting in the
# primary slot, which is what section 6 asks for. Equal counters are accepted,
# lower are refused, and the refusal scrambles the secondary slot.
#
# Nothing is remembered. The reference value lives in the same flash an
# attacker would be attacking, which is exactly what section 6 means by
# "software downgrade prevention, because a physical attacker can rewrite boot
# state". Never say this device remembers a counter, and never call it
# monotonic on this part.
#
# Not CONFIG_MCUBOOT_HW_DOWNGRADE_PREVENTION. That defines
# MCUBOOT_HW_ROLLBACK_PROT, whose boot_nv_security_counter_get and _update are
# implemented nowhere in the Zephyr port; enabling it fails at link on this
# board with exactly those two undefined references. Verified by building it.
# See issue #66.
#
# One consequence to know before flashing: bootutil_get_img_security_cnt
# returns an error when the primary slot's image carries no protected TLV area,
# and check_downgrade_prevention treats that as permission to swap. Every image
# before Tier 4 is like that, so downgrade prevention is inert until a
# counter-carrying image has become the primary.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER=y

# Report what the bootloader saw in an image before it judges it. From Tier 4
# the hook also walks the protected TLV area and reports the security counter
# for both slots, because that is the pair MCUboot compares.
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y
CONFIG_COURSE_REFUSAL_REASON=y
