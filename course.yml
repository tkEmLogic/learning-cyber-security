schema_version: 1

course:
  id: learning-cyber-security
  version: "1.0"
  minimum_wrapper_version: "1.0.0"
  environment_marker_ttl_hours: 24

runtime:
  bind_default: 127.0.0.1
  private_bind_allowed: true
  ota_port: 8080
  ota_tls_port: 8443
  impersonation_port: 18080
  impersonation_tls_port: 18443
  operator_tls_port: 8444
  service_name: ota.course.example

paths:
  state: .course-state
  secrets: .course-secrets
  build: build
  generated_artifacts: artifacts/generated
  learner_evidence: evidence/learner
  cleanup_allowlist:
    - .course-state
    - .course-secrets
    - build
    - artifacts/generated

components:
  course_helper:
    path: tools/course
    build: [go, build, ./tools/course]
  ota_service:
    path: services/ota
    build: [go, build, ./services/ota/cmd/ota]
  firmware:
    path: firmware/reference-product-baseline
    build: [./course, build, firmware]
    target: esp32c6_devkitc/esp32c6/hpcore
    zephyr: 4.4.2
    mcuboot: 2.4.0
    image_mode: unsigned
    upgrade_mode: swap_using_offset
    variants:
      baseline:
        release_id: tier-00-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-00-baseline.bin
      altered:
        release_id: tier-00-altered
        beacon_state: fast
        image: artifacts/generated/releases/tier-00-altered.bin
      tier-02-baseline:
        release_id: tier-02-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-02-baseline.bin
        app: firmware/tier-02-authenticated-service
      tier-03-baseline:
        release_id: tier-03-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-03-baseline.bin
        app: firmware/tier-03-signed-images
        # From Tier 3 the bootloader checks who published an image. The
        # component level image_mode above describes Tier 0 and Tier 2, which
        # do not, and it stays true of them.
        image_mode: signed_ecdsa_p256
        # Only the public half is ever a build input, and this is it. The
        # Release signing key is deliberately absent from this manifest: it is
        # named by ./course release sign and by nothing else.
        public_key: artifacts/generated/signing/release.pub.pem

# Tier 9 scans the firmware and the OTA service against vulnerability
# databases that are pinned here, so every Learner gets the same matches on
# any day. A scanner result is true only as of its database date, and a
# different scanner version matches the same database differently, so the
# scanner versions are pinned beside the databases. `./course scan` refuses a
# scanner of any other version. The dev container installs these versions
# (.devcontainer/Dockerfile). See issues #267, #272 and #277.
scanning:
  # Under the user cache directory (~/.cache on Linux), not the repository:
  # the imported grype database is about 3.1 GB, and `./course clean` should
  # not force a Learner to download 182 MB again.
  cache: learning-cyber-security/tier-09
  # The service is scanned and described as it shipped, built with the
  # go1.24.0 toolchain the dev container uses, whichever Go the host has.
  # go.mod has no toolchain line on purpose: adding one is the Learner's
  # Tier 9 fix for the unsupported component (#272).
  go_toolchain: go1.24.0
  grype:
    version: v0.119.0
    database:
      name: vulnerability-db_v6.1.9_2026-09-29T00:34:00Z_1790663551.tar.zst
      # The single place to change if the course hosts its own copy. It is not
      # known how long Anchore keeps old archives at this address, and
      # `./course scan setup --archive <file>` accepts a copy from elsewhere.
      url: https://grype.anchore.io/databases/v6/vulnerability-db_v6.1.9_2026-09-29T00:34:00Z_1790663551.tar.zst
      sha256: 1e88821121dd3ec9bef68b4eb7c5524997f62da37215113ec256179d4e6da8cf
      size: 182413359
      built: "2026-09-29T06:32:31Z"
  govulncheck:
    version: v1.8.0
    database:
      # Small enough to commit, so the service scan needs no download at all.
      path: artifacts/pinned/tier-09/go-vulndb-2026-09-28.zip
      url: https://vuln.go.dev/vulndb.zip
      sha256: faa8c45538d259ae1fd3c34ae20632ee738d1190836c84ac95d5f2bc604d85bc
      size: 3351093
      modified: "2026-09-28T16:43:40Z"

services:
  ota:
    protocol: http
    bind: 0.0.0.0
    port: 8080
    health: /health
    marker: /.well-known/course-environment
    state_path: .course-state/ota
    release_path: artifacts/generated/releases
  impersonation:
    protocol: http
    bind: 127.0.0.1
    port: 18080
    lifecycle: fixture-scoped

devices:
  reference_beacon:
    synthetic_id: beacon-development-shared
    spoof_id: beacon-development-clone
    board: esp32c6_devkitc/esp32c6/hpcore
    stable_serial_prefix: /dev/serial/by-id/
    states:
      steady: normal
      fast: fictional_error_1
      slow: fictional_error_2
    hardware_required:
      - flash
      - logs
      - update
      - recover

fixtures:
  tier-00/plaintext-inspection:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: HTTP release fields and firmware bytes are readable.
    changes:
      - artifacts/generated/attacks/tier-00/plaintext-inspection
    reset: ./course attack reset tier-00/plaintext-inspection
    hardware_required: false
  tier-00/device-id-spoofing:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The service accepts a status body that names the second synthetic device.
    changes:
      - .course-state/ota/events.jsonl
      - artifacts/generated/attacks/tier-00/device-id-spoofing
    reset: ./course attack reset tier-00/device-id-spoofing
    hardware_required: false
  tier-00/service-impersonation:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: Generated device configuration accepts a marker-matching HTTP impersonation service.
    changes:
      - .course-state/device-config.json
      - artifacts/generated/attacks/tier-00/service-impersonation
    reset: ./course attack reset tier-00/service-impersonation
    hardware_required: false
  tier-00/altered-image:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The service delivers the manifest-owned altered unsigned image. An attached device installs and runs it.
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/releases/tier-00-altered.bin
      - artifacts/generated/attacks/tier-00/altered-image
    reset: ./course attack reset tier-00/altered-image
    reset_keeps_built_image: true
    hardware_required: true
  tier-03/hostile-image:
    tier: "03"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service publishes a manifest-owned hostile image and delivers it unchanged. What the device does with it is not known to the fixture.
    images:
      unsigned: tier-03-hostile-unsigned.bin
      modified: tier-03-hostile-modified.bin
      wrong-key: tier-03-hostile-wrong-key.bin
      truncated: tier-03-hostile-truncated.bin
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-03/hostile-image
    reset: ./course attack reset tier-03/hostile-image
    reset_keeps_built_image: true
    hardware_required: true
  # Tier 4 publishes hostile release metadata, not hostile firmware. All six
  # variants point at the Learner's own good image; what is wrong with them is
  # the signed description of it, so the selector names a release rather than a
  # file. See docs/fixture-safety-contract.md, "Tier 4 fixtures".
  tier-04/hostile-release:
    tier: "04"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service publishes a manifest-owned hostile Release manifest and serves it and its detached signature back unchanged. What the device does with it is not known to the fixture.
    releases:
      modified: tier-04-hostile-modified
      wrong-key: tier-04-hostile-wrong-key
      hardware: tier-04-hostile-hardware
      channel: tier-04-hostile-channel
      size: tier-04-hostile-size
      digest: tier-04-hostile-digest
      counter-mismatch: tier-04-hostile-counter-mismatch
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-04/hostile-release
    reset: ./course attack reset tier-04/hostile-release
    reset_keeps_built_image: true
    hardware_required: true
  # The replay forges nothing, so it has no selector at all. It re-assigns a
  # release this environment produced, chosen by comparing signed security
  # counters, and it never edits a manifest or a signature.
  tier-04/replay-release:
    tier: "04"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service re-assigns an older release of its own, unedited and still verifying. What the device does with it is not known to the fixture, and the check is inert unless a counter-carrying image is already in the primary slot.
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-04/replay-release
    reset: ./course attack reset tier-04/replay-release
    reset_keeps_built_image: true
    hardware_required: true
  tier-02/plaintext-inspection:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: Release records left the plain HTTP port and are readable only over a verified connection.
    changes:
      - artifacts/generated/attacks/tier-02/plaintext-inspection
    reset: ./course attack reset tier-02/plaintext-inspection
    hardware_required: false
  tier-02/service-impersonation:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: A certificate for the right name from an untrusted authority is refused.
    changes:
      - .course-state/device-config.json
      - artifacts/generated/attacks/tier-02/service-impersonation
    reset: ./course attack reset tier-02/service-impersonation
    hardware_required: false
  tier-02/name-mismatch:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: A certificate issued by the trusted authority for another name is refused.
    changes:
      - artifacts/generated/attacks/tier-02/name-mismatch
    reset: ./course attack reset tier-02/name-mismatch
    hardware_required: false

  # Tier 6 clones the shared development identity. The one fixture reads the
  # credential out of the Learner's own built shared image and acts as the
  # fleet against the provisioning station, with no board involved: a copied
  # credential does not need the hardware it was copied from. Its target is the
  # manufacturing record, not a firmware image, and its reset appends rather
  # than deletes because the record is append only by design. See
  # docs/fixture-safety-contract.md, "Tier 6 fixtures".
  tier-06/clone-shared-identity:
    tier: "06"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The fleet credential, extracted from the Learner's own shared image, registers a second entry under an identifier the record already holds and several devices that were never manufactured, all under one certificate fingerprint.
    image: tier-06-shared-identity.bin
    phantom_ids:
      - beacon-phantom-0001
      - beacon-phantom-0002
      - beacon-phantom-0003
    changes:
      - .course-state/provisioning/records.jsonl
      - artifacts/generated/attacks/tier-06/clone-shared-identity
    reset: ./course attack reset tier-06/clone-shared-identity
    hardware_required: false

  # Tier 9's support-listener attack fixture: the small UDP sender the design
  # calls for (#269). It sends one one-word request to the board's
  # unauthenticated support listener and prints exactly what it sent and what
  # came back. The two requests are allowlisted here behind --request, the same
  # shape Tier 3's images use, so the destructive reboot can never be reached
  # without naming it. The marker handshake goes to the loopback OTA service, as
  # the Tier 6 clone's does: the board serves no marker of its own, and the
  # handshake is about which environment a fixture may act in. The board's
  # address is not on this fixture's command line; it is recorded once with
  # ./course device address and read from generated state. See
  # docs/fixture-safety-contract.md, "Tier 9 fixtures".
  tier-09/support-listener:
    tier: "09"
    target: http://127.0.0.1:8080
    interface: loopback
    port: 7700
    expected_effect: The unauthenticated support listener answers an inventory query with the device id, release and security counter, and restarts the board on a reboot request.
    requests:
      inventory: inventory
      reboot: reboot
    changes:
      - artifacts/generated/attacks/tier-09/support-listener
    reset: ./course attack reset tier-09/support-listener
    hardware_required: true

# The Tier 7 adversary is one actor rather than a set of fixtures, so it is
# not a `fixtures:` entry: it is not registered, `./course attack list` does
# not show it, and `./course attack run` never reaches it. It lives under
# `./course service bypass e-7-NN`, a sibling of `./course service start`,
# because a Learner who typed `provision bypass` to test a mutual-TLS refusal
# would have been told the opposite of what this tier teaches.
#
# It still reads every mutable input from here. The allowlist rule does not
# depend on which command runs the fixture: no device identifier, owner slug,
# serial, endpoint, port or count is ever supplied on a command line. See
# docs/fixture-safety-contract.md, "Tier 7 fixtures".
bypass:
  tier-07:
    tier: "07"
    # The plain target, for the marker handshake and nothing else. The marker
    # is never fetched over a TLS port, and Tier 7 is the tier where that rule
    # earns its keep: the adversary holds the Operational CA key, so a
    # mutual-TLS marker fetch is a check it could satisfy with its own forged
    # credential.
    target: http://127.0.0.1:8080
    interface: loopback
    device_port: 8443
    operator_port: 8444
    service_name: ota.course.example
    # Exactly one adversary owner, fixed here and minted idempotently by the
    # first runner that needs it. It is a fully legitimate account in the real
    # owner store, which is the point: every refusal it collects is an
    # authorization decision and not an authentication one.
    adversary_owner: rival-labs
    # The bounded list. Names are never invented at run time, and an
    # unbounded loop enrolling devices is not a demonstration of scale.
    synthetic_ids:
      - beacon-bypass-e7-03
      - beacon-bypass-e7-04
      - beacon-bypass-e7-05
      - beacon-bypass-e7-06
      - beacon-bypass-e7-07
      - beacon-bypass-e7-08
      - beacon-bypass-e7-08-donor
      - beacon-bypass-e7-09
      - beacon-bypass-e7-10
      - beacon-bypass-e7-11
      - beacon-bypass-e7-12
      - beacon-bypass-e7-13
      - beacon-bypass-e7-14
    changes:
      - .course-state/provisioning/records.jsonl
      - .course-state/provisioning/owners.jsonl
      - .course-state/provisioning/revoked.jsonl
      - .course-state/ota/events.jsonl
      - .course-state/bypass/tier-07
      - artifacts/generated/attacks/tier-07
    reset: ./course service bypass reset
  # Tier 8's rows, under the same command and driven by the same adversary:
  # one owner account, one fixture state, one reset. Here the adversary is the
  # owner or the manufacturer of its own synthetic devices. It withdraws an
  # authority with a real Tier 8 operation and shows that the credential it
  # kept is refused. It signs nothing with the Operational CA key. See
  # docs/fixture-safety-contract.md, "Tier 8 fixtures".
  tier-08:
    tier: "08"
    target: http://127.0.0.1:8080
    interface: loopback
    device_port: 8443
    operator_port: 8444
    service_name: ota.course.example
    # The same single adversary owner as Tier 7. The runner refuses to start
    # if the two blocks disagree.
    adversary_owner: rival-labs
    # The last two share a locally administered MAC suffix, 02000000e810, so
    # the station keys them to one synthetic board. No real board carries it.
    synthetic_ids:
      - beacon-bypass-e8-01
      - beacon-bypass-e8-02
      - beacon-bypass-e8-03
      - beacon-bypass-e8-04
      - beacon-bypass-e8-05
      - beacon-bypass-e8-06
      - beacon-bypass-e8-07
      - beacon-bypass-e8-08
      - beacon-bypass-e8-09
      - beacon-bypass-e8-10-02000000e810
      - beacon-bypass-e8-10b-02000000e810
    changes:
      - .course-state/provisioning/records.jsonl
      - .course-state/provisioning/owners.jsonl
      - .course-state/provisioning/revoked.jsonl
      - .course-state/ota/events.jsonl
      - .course-state/bypass/tier-07
      - artifacts/generated/attacks/tier-08
    reset: ./course service bypass reset

# The synthetic canary fleet (#279). Host-side devices with real Factory and
# real, claimed, active Operational identities, obtained through the same
# station and claim machinery the Tier 7 and 8 fixtures use, legitimately, as
# the manufacturer and an owner would. They poll GET /v1/releases/current over
# mutual TLS so the rest of the fleet is visible in a rollout while the board is
# the canary. Every line the command prints is a HOST result, and a host result
# never stands in for a device result. It is not a fixture and not an adversary,
# so it has its own block and its own command, ./course fleet. See
# docs/fixture-safety-contract.md, "Tier 9 fixtures".
fleet:
  tier: "09"
  # The plain target, for the marker handshake and nothing else.
  target: http://127.0.0.1:8080
  interface: loopback
  device_port: 8443
  operator_port: 8444
  service_name: ota.course.example
  # One legitimate fleet owner, minted idempotently. It is not harbor-owner,
  # which owns the real board, and not the rival-labs adversary.
  owner: beacon-fleet-ops
  # The bounded list of synthetic fleet devices. Names are never invented at
  # run time and never supplied on a command line.
  device_ids:
    - beacon-fleet-e9-01
    - beacon-fleet-e9-02
    - beacon-fleet-e9-03
    - beacon-fleet-e9-04
  changes:
    - .course-state/provisioning/records.jsonl
    - .course-state/provisioning/owners.jsonl
    - .course-state/ota/events.jsonl
    - .course-state/fleet
  reset: ./course fleet reset

# The Tier 10 integration scenario (#288, #291). Not a fixture and not an
# adversary: a runner that stages eight scenario events, one per
# ./course scenario next, by calling machinery the course already has. Every
# input it passes to that machinery is allowlisted here, so no fixture,
# selector, row, device, count or interval is ever supplied on a command line.
# The only Learner input is --device on start, and it must name an active
# device in the manufacturing record.
#
# The event identifiers are permanent names, allocated once in the spirit of
# docs/adr/0001-identifier-allocation.md: the incident record, the Mentor key
# and the timeline template refer to them, so an event that is ever dropped
# leaves its identifier unused rather than reassigned. `stage` names the
# runner's step for the event; it is the answer key's mechanism, so the
# Learner-facing output never prints it. See docs/fixture-safety-contract.md,
# "Tier 10 scenario".
scenario:
  tier: "10"
  # The plain target, for the marker handshake and nothing else.
  target: http://127.0.0.1:8080
  interface: loopback
  # The Tier 9 end state the scenario starts from.
  baseline_release: tier-09-remediation
  # The teammate's release, and the role that approves, rolls out and
  # advances it. A role, never a person's name.
  candidate_variant: candidate
  candidate_release: tier-10-candidate
  actor: teammate
  # Event 6 cuts every firmware transfer after this share of the candidate's
  # size, so one cut and one resume complete it.
  interrupt_fraction: 0.6
  # Bounded waits for what the board does on its own schedule.
  transfer_wait_seconds: 600
  revert_wait_seconds: 600
  # Event 8 is a bounded series of separate single-datagram fixture runs, one
  # every interval, stopping at the first answer.
  listener_interval_seconds: 10
  listener_max_seconds: 480
  events:
    - id: tier-10/event-01
      number: 1
      where: board
      stage: present
      present: wrong-name
    - id: tier-10/event-02
      number: 2
      where: board
      stage: fixture
      fixture: tier-04/hostile-release
      selector: wrong-key
    - id: tier-10/event-03
      number: 3
      where: board
      stage: fixture
      fixture: tier-04/replay-release
    - id: tier-10/event-04
      number: 4
      where: host
      stage: bypass
      row: e-8-07
    - id: tier-10/event-05
      number: 5
      where: service
      stage: rollout
    - id: tier-10/event-06
      number: 6
      where: board
      stage: transfer
    - id: tier-10/event-07
      number: 7
      where: board
      stage: revert
    - id: tier-10/event-08
      number: 8
      where: board
      stage: fixture-series
      fixture: tier-09/support-listener
      selector: inventory
  changes:
    - .course-state/scenario
    - .course-state/ota.log
    - .course-state/ota/current-release.json
    - .course-state/ota/events.jsonl
    - .course-state/provisioning/records.jsonl
    - artifacts/generated/releases
    - artifacts/generated/attacks/tier-04
    - artifacts/generated/attacks/tier-08
    - artifacts/generated/attacks/tier-09/support-listener
  reset: ./course scenario reset

# Tier 10's regression rerun (#292), ./course regression run. It reruns the
# board-capable fixtures against the release the board is running, and the
# host fixtures and runners separately, as the regression evidence the final
# claim matrix opens with (#289). Every result line carries the fixture id, a
# result and a board or host label, and a host result never stands in for a
# board result. The settled inputs are #284's 9 and 10, #287's T10-W-38 and
# T10-W-39, and #289's "Carried forward".
#
# What the board did is read from the device's own records as the service
# stored them, in .course-state/ota/events.jsonl, from the board's device id.
# The board is the one device that reported over mutual TLS recently and is not
# named by any synthetic list in this manifest. No id is ever typed.
#
# The expected outcomes below come from the earlier campaigns: Tier 3 #226,
# Tier 4 #227, Tier 9 #280 (the verification rows above), and #287. A stored
# event names the release, not the check: the check name is printed on the
# board's serial console only (release.refused check=...), so `check` here says
# which serial line witnesses the refusal and is compared only if the event
# ever carries one.
regression:
  tier: "10"
  # The plain target, for the marker handshake and nothing else, as for every
  # fixture.
  target: http://127.0.0.1:8080
  interface: loopback
  device_port: 8443
  operator_port: 8444
  service_name: ota.course.example
  # The bound on one wait for a board reaction. The board polls every 30 s; a
  # refusal after a download, or one at the next boot, needs the download and a
  # reboot on top. A wait that runs out is "no result", never a pass.
  board_wait_seconds: 240
  # How recent the board's last status report must be for the run to say which
  # release it is running. A candidate trial reports nothing until it is over,
  # so this is wider than a trial: download, reboot and the 60 s health window.
  board_fresh_seconds: 600
  # The support listener is asked up to four times, 15 s apart, and the run
  # stops at the first answer. Only silence is retried. 45 s covers the boot
  # of a trial image that a run started a little early. The command caps both.
  support_attempts: 4
  support_interval_seconds: 15

  # Board results, in the order they run.
  #
  # The release entries publish through the Fleet baseline, as the fixtures
  # do, and on this service that is a compromised hosting side writing the
  # state file (docs/fixture-safety-contract.md, "Tier 10"). A device in an
  # open rollout is offered the rollout's release instead, so while a rollout
  # is open every release entry is "no result: not offered". The full run is
  # therefore after the corrected rollout completes; before it advances, the
  # support listener and the host results are what can run.
  board:
    # First, and only inventory. The planted regression (T10-W-38) is live only
    # while the candidate is on trial, so this must be the first thing a run
    # does, and a run started in that window catches it. Against the corrected
    # release the listener is absent and the board's stack answers port
    # unreachable. Silence is no result: a lost datagram looks the same, and
    # the boot log's "absent" line is the strong evidence (#287).
    - id: tier-09/support-listener
      request: inventory
      expect: absent

    # Tier 4's seven hostile manifests and the replay test the application's
    # release policy, which is code the Tier 10 release carries and so can
    # regress. All of them run.
    #
    # The board stores update.refused (or update.failed after a download)
    # naming the release, and the check name only on its serial console, so
    # `check` is the serial line that witnesses each one. The seven are
    # derived from the newest Tier 4 release, at counter 2. Checks run in the
    # order signature, hardware, counter, channel, so on a counter-8 board
    # only the first three reach their own check and the other four are
    # refused at security-counter. The run shows the policy refuses all seven;
    # it does not show the channel, size and digest checks firing on Tier 10.
    - id: tier-04/hostile-release
      release: modified
      expect: refused
      check: manifest-signature
    - id: tier-04/hostile-release
      release: wrong-key
      expect: refused
      check: manifest-signature
    - id: tier-04/hostile-release
      release: hardware
      expect: refused
      check: hardware-compatibility
    - id: tier-04/hostile-release
      release: channel
      expect: refused
      check: security-counter
    - id: tier-04/hostile-release
      release: size
      expect: refused
      check: security-counter
    - id: tier-04/hostile-release
      release: digest
      expect: refused
      check: security-counter
    # On a Tier 4 board this one reached MCUboot (#227). At counter 2 against
    # 8 the application refuses it first.
    - id: tier-04/hostile-release
      release: counter-mismatch
      expect: refused
      check: security-counter
    # The newest good release from Tiers 4 to 9 below the baseline's counter
    # that was not withdrawn: tier-09-remediation at 6 on a Tier 10 bench. The
    # Time floor never refuses an older manifest; it only stays where it is.
    - id: tier-04/replay-release
      expect: refused
      check: security-counter

    # Tier 0's and Tier 3's images carry no Release manifest, so from Tier 4 the
    # board finds none for them (404 at the manifest fetch) and refuses before
    # downloading a byte. The bootloader behind that check is not reached. Two
    # Tier 3 variants and the Tier 0 image show it: the outsider's unsigned
    # image, one signed by another key, and Tier 0's altered build.
    - id: tier-03/hostile-image
      image: unsigned
      expect: refused
    - id: tier-03/hostile-image
      image: wrong-key
      expect: refused
    - id: tier-00/altered-image
      expect: refused

  # Host results, reported apart from the board results.
  host:
    # The Tier 0 and Tier 2 attacks, replayed as one request each against the
    # running Tier 10 service. They are not run through ./course attack run:
    # those fixtures publish to the TLS port without a client certificate and
    # reset by asking the service to reseed, which on this service would drop
    # the event log the board results are read from.
    - id: tier-00/plaintext-inspection
      probe: plain-release-record
      expect: not-served
    - id: tier-02/plaintext-inspection
      probe: client-certificate-required
      expect: refused
    - id: tier-02/service-impersonation
      probe: untrusted-certificate
      expect: refused
    - id: tier-02/name-mismatch
      probe: wrong-name-certificate
      expect: refused
    # The refusal that answers the Tier 6 clone: the hardened station enrolls
    # only a device carrying a Bootstrap credential.
    - id: e-6-07
      answers: tier-06/clone-shared-identity
      expect: refused
    # Every Tier 7 and Tier 8 host runner, through ./course service bypass's
    # own wrapper. ./course service bypass reset runs once after them.
    - {id: e-7-03, expect: refused}
    - {id: e-7-04, expect: refused}
    - {id: e-7-05, expect: refused}
    - {id: e-7-06, expect: refused}
    - {id: e-7-07, expect: refused}
    - {id: e-7-08, expect: refused}
    - {id: e-7-09, expect: refused}
    - {id: e-7-10, expect: refused}
    - {id: e-7-11, expect: refused}
    - {id: e-7-12, expect: refused}
    - {id: e-7-13, expect: refused}
    - {id: e-7-14, expect: refused}
    - {id: e-7-15, expect: refused}
    - {id: e-8-01, expect: refused}
    - {id: e-8-02, expect: refused}
    - {id: e-8-03, expect: refused}
    - {id: e-8-04, expect: refused}
    - {id: e-8-05, expect: refused}
    - {id: e-8-06, expect: refused}
    - {id: e-8-07, expect: refused}
    - {id: e-8-08, expect: refused}
    - {id: e-8-09, expect: refused}
    - {id: e-8-10, expect: refused}

  # Fixtures and variants this command does not rerun, each with its reason.
  # The run prints every one as "not run", so the choice stays visible.
  not_rerun:
    - id: tier-09/support-listener
      selector: reboot
      reason: A reset during a candidate trial is a failed trial, so it would burn one of the board's three attempts and cause the revert it is meant to observe.
    - id: tier-03/hostile-image
      selector: modified
      reason: Refused at the same point as unsigned and wrong-key, the missing Release manifest, so it adds no check.
    - id: tier-03/hostile-image
      selector: truncated
      reason: Refused at the same point as unsigned and wrong-key, the missing Release manifest, so it adds no check.
    - id: tier-00/service-impersonation
      reason: Its imposter speaks plain HTTP, which no Tier 10 device uses for data; tier-02/service-impersonation is the same attack against TLS.
    - id: tier-00/device-id-spoofing
      reason: The plain port takes no events any more (tier-00/plaintext-inspection), and the identity form of the attack is E-7-09.
    - id: tier-06/clone-shared-identity
      reason: It demonstrates the shared variant, which no Tier 10 release carries, and each run appends to the manufacturing record; E-6-07 is the refusal that answers it.
    - id: e-8-11
      reason: It builds Tier 8's Time floor for native_sim in the Zephyr workspace; it says nothing about the running release.

