      template: evidence/templates/tier-02/claim-and-residual-risk.md
      format: markdown
      learner_path: evidence/learner/tier-02/claim-and-residual-risk.md

safety:
  synthetic_data_only: true
  marker_required: true
  marker_path: .course-state/environment.json
  dry_run_default: true
  execute_identifier_required: true
  refuse_after_failed_reset: true
  target_rules:
    localhost: true
    rfc1918_ipv4: true
    ipv6_unique_local: true
    ipv6_link_local: true
    dns_names: false
    redirects: false
    discovery: false
  cleanup_confirmation: REMOVE COURSE GENERATED STATE

checkpoints:
  publication_owner_issue: 28
  publication_status: pending

verification:
  # The hardware rows below are the course's claims about physical behavior,
  # and the ESP32-C6-DevKitC-1 is the only board they can be observed on. A
  # row is validated only once it has been seen on that board. Until then it
  # is pending, however the firmware or a host test behaves. Rows that were
  # never reached, or that no control yet covers, keep a value that says why.
  tier_00:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-00.json
    revision_bound: true
    hardware:
      flash: validated
      serial: validated
      wifi_association: validated
      http_exchange: validated
      ota_download: validated
      altered_image_execution: validated
      # Issue #224. A person watched the WS2812 on GPIO8: solid green for the
      # baseline, red blinking fast for the altered image, and red blinking
      # slowly for a bench build with the slow state. The colour order is
      # right, and the board boots normally with the strapping pin driven.
      # Brightness 24 was too bright, so the default is now 8.
      led_behavior: validated
  tier_02:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-02.json
    revision_bound: true
    hardware:
      # Issue #225. The refusals are flags 0x08 (untrusted issuer) and 0x04
      # (wrong name), each followed by a verified connection once the real
      # certificate was back. Status events are stored as transport https
      # since #233.
      tls_handshake_verified: validated
      untrusted_certificate_refused: validated
      wrong_name_certificate_refused: validated
      recovery_after_refusal: validated
      certificate_dates_checked: not_checked_no_clock
      # Issue #62. The application's TLS buffer must hold a firmware image in
      # full sized records, not only the small JSON that Tier 2 fetches.
      # Observed in #225: the 663820 byte image, published under the fresh
      # release identifier tier-02-tls-download, was downloaded over the
      # verified connection, written to the secondary slot, swapped in by
      # MCUboot, and run.
      ota_download_over_tls: validated
      ota_install_completed: validated
      # Tier 2 installs whatever the verified service names. The device says so
      # itself while doing it: "installing without any check". Tier 3 is where
      # that closes.
      image_authenticity_checked: not_checked_no_control_yet
  tier_03:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-03.json
    revision_bound: true
    hardware:
      # Every row below is observed through the real update path: published by
      # the genuine service, downloaded over the verified connection, written
      # to the secondary slot, and judged by the bootloader on the next boot.
      # Issue #226: the signed image was published as tier-03-signed-install
      # and swapped in with key=match; the four hostile images were refused
      # with key=other, signature=none, key=match, and tlv=truncated, and the
      # board booted tier-03-baseline after each.
      signed_image_installed: validated
      unsigned_image_refused: validated
      modified_image_refused: validated
      wrong_key_image_refused: validated
      truncated_image_refused: validated
      running_release_preserved_after_refusal: validated
      trusted_key_reported_at_boot: validated
      # Nothing authenticates the bootloader that holds the key. This is the
      # software chain the specification describes, recorded as T3-W-10, and it
      # needs Secure Boot v2 in Advanced Tier A.
      bootloader_authenticity: not_checked_software_chain
  tier_04:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-04.json
    revision_bound: true
    hardware:
      # Every row below is observed through the real OTA path: published by
      # the genuine service over the verified connection, judged by the
      # application before the write, and judged by MCUboot on the next boot.
      # Issue #227: security-fix installed at counter 2; the seven hostile
      # releases and the replay were each refused at their own check, and the
      # counter-mismatch image was accepted by the application and erased by
      # MCUboot, counter=1 in the secondary slot against counter=2 in the
      # primary.
      signed_release_installed: validated
      modified_manifest_refused: validated
      wrong_key_manifest_refused: validated
      incompatible_hardware_refused: validated
      wrong_channel_refused: validated
      unexpected_size_refused: validated
      digest_mismatch_refused: validated
      replayed_lower_counter_refused: validated
      running_release_preserved_after_refusal: validated
      # The one release the application accepts. Everything it can check is
      # true; the image it points at carries the older counter in its signed
      # TLV, which only MCUboot reads. The row needs the application accepting,
      # the bytes being written, and the bootloader erasing the slot with
      # "Image 0 in slot 1 erased due to downgrade prevention", the hook
      # reporting the lower counter in the secondary slot against the higher
      # one in the primary.
      bootloader_refused_downgrade_independently: validated
      security_counter_reported_by_bootloader_hook: validated
      # The manifest carries creation and support dates, and this device has no
      # clock. They are signed so they cannot be edited afterwards and reported
      # without being acted on. Same root as T2-W-09.
      manifest_dates_checked: not_checked_no_clock
      # Section 7's sixth rejection condition. Tier 4 has no confirmation flow
      # because test boot and confirmation are Tier 5's subject.
      already_confirmed_image_refused: not_implemented_tier_05
      # Downgrade prevention is inert until a counter-carrying image is already
      # primary, because MCUboot allows the swap when the primary slot's image
      # has no counter. Every image before Tier 4 is like that.
      first_install_protected: not_protected_by_design

  tier_05:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-05.json
    revision_bound: true
    hardware:
      # Issue #228, on the ESP32-C6-DevKitC-1. The confirmation row needed
      # #236: a queued event is now retried on every poll until the service
      # takes it. The healthy trial needed #235's stepping stone, because the
      # first Tier 5 release is installed by Tier 4 with a permanent swap.
      # reset_during_swap_recovers: a reset landed after "Starting swap using
      # offset algorithm.", and the next boot resumed the swap and started the
      # candidate on trial.
      # Every row below is observed over the real OTA path, with releases
      # signed by the Learner's own key.
      test_upgrade_requested_not_permanent: validated
      healthy_release_confirms: validated
      crashing_release_reverts: validated
      hung_release_reset_by_watchdog_and_reverts: validated
      failed_health_release_reverts: validated
      health_window_stall_reverts: validated
      revert_restores_last_confirmed_image: validated
      failure_reason_replayed_after_revert: validated
      # A crash and a hang leave no written reason, because neither reaches the
      # code that could record one. The device says so rather than inventing a
      # cause, and the module teaches the asymmetry.
      crash_and_hang_leave_no_reason: validated
      interrupted_download_resumes: validated
      # The strongest result of the tier. A hard reset partway through a
      # download loses every byte of RAM; the progress record in NVS must
      # survive it, and the device must resume from exactly the recorded
      # offset and finish.
      download_resumes_after_hard_reset: validated
      digest_computed_by_reading_slot_back: validated
      invalid_range_response_refused: validated
      invalid_range_response_discards_partial_download: validated
      changed_release_discards_partial_download: validated
      already_confirmed_image_refused: validated
      bounded_retry_stops_repeated_failure: validated
      network_loss_does_not_fail_health_gate: validated
      network_loss_causes_no_revert_loop: validated
      # The trial reaches its verdict with no network, by design, so the event
      # is queued and sent once the link is up. Both must reach the service,
      # and a revert names the running release with the failed one in the
      # detail rather than the other way round.
      confirmation_reported_after_link_returns: validated
      revert_reported_after_link_returns: validated
      revert_without_reason_still_reported: validated
      # The defect behind these two was found in Tier 7 and fixed here: #175.
      # Each revert must produce exactly one update.reverted event, naming the
      # release that actually failed and the check it failed at. A later boot
      # of the confirmed image, holding the trial record for a release it is
      # not running, must queue nothing.
      one_revert_reports_exactly_one_event: validated
      # The reason the fix marks the record rather than clearing it. After the
      # third revert the board must still refuse the release at
      # check=trial-limit, so silencing the duplicate report does not cost the
      # bound that stops a revert loop.
      reported_flag_does_not_disturb_the_trial_limit: validated
      # Section 6's claim, checked in MCUboot's source during charting:
      # check_downgrade_prevention() runs only for TEST and PERM swaps, so a
      # revert never passes through it.
      #
      # The crash release must carry a higher counter than the confirmed image
      # it reverts to. Equal counters would not test anything: prevention
      # refuses only when the primary counter is strictly greater, so it would
      # not fire even if a revert did pass through it.
      revert_not_blocked_by_downgrade_prevention: validated
      reset_during_swap_recovers: validated
      # Not reached. See the resolution on issue #97 for what was and was not
      # covered, and why these are honest gaps rather than passing rows.
      reset_during_trailer_update: not_reached
      reset_during_confirmation_write: not_reached
      reset_after_confirmation: not_reached
      signed_serial_recovery: not_built_advanced_tier_a

  tier_06:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-06.json
    revision_bound: true
    hardware:
      # Issue #229, on the ESP32-C6-DevKitC-1 (MAC 20:6E:F1:17:0D:64). The
      # device enrolled as beacon-206ef1170d64 and was remanufactured as
      # beacon-remfg-206ef1170d64. E-6-05 decrypted both keys from one dump
      # with SHA-256(MAC || 0x0000 || 01 06 00 80), each matching the public
      # key its certificate recorded. The shared image registered from the
      # board (three times out of three) after #237, whose failure did not
      # reproduce from a clean flash. The RNG history row was retired in #238:
      # the course teaches security, not how to reproduce an old bug.
      # Nothing is claimed from a host result, with one named exception: the
      # five station-refusal bypass rows E-6-01, E-6-02, E-6-03, E-6-06 and
      # E-6-07 are witnessed by the provisioning station on the host by design
      # (decision #115). The refusal is a station decision and no device is
      # involved, so the host is the witness the tier intends.

      # The device generates a P-256 key into PSA Secure Storage and it
      # survives a reboot. Decrypting the storage partition shows the live key
      # matching the public key in the certificate the station issued.
      key_generated_on_device_survives_reboot: validated
      # The certification request parses and carries the Bootstrap credential
      # inside the signature, which openssl req -verify confirms.
      certification_request_carries_credential: validated
      # The station issues a certificate and consumes the credential in one
      # appended record, before anything reaches the device.
      station_issues_and_consumes_in_one_append: validated
      # The device reports the identifier out of its own certificate, and the
      # service stores its events under that identifier rather than the shared
      # one.
      device_reports_identifier_service_stores_it: validated
      # The shell closes on enrollment and reopens on a deliberate BOOT-button
      # long press, in place, with no reset. #128 replaced reset-time sampling,
      # which could not work cleanly because sw0 is the GPIO9 strapping pin.
      shell_closes_after_enrollment: validated
      boot_button_reopens_shell: validated
      # The factory image boots unprovisioned, opens the shell itself, and makes
      # no OTA contact: the poll is gated on holding an identity.
      factory_boots_unprovisioned_no_ota_contact: validated

      # Section 11 bypass rows, decision #115: five refusals and two successes.
      e6_01_replay_consumed_credential_refused: validated
      e6_02_identifier_reuse_refused: validated
      e6_03_bad_proof_of_possession_refused: validated
      # Witnessed by the device: provision export returns status=-133
      # (PSA_ERROR_NOT_PERMITTED). The key was generated with no export usage.
      e6_04_export_refused_on_device: validated
      # The one bypass that succeeds. ./course device dump reads the storage
      # partition and the P-256 private key is recovered by decrypting the ITS
      # record with SHA-256(MAC || 0x0000 || uid): a key derived only from the
      # public MAC and the uid, which is in clear as the settings entry name
      # its/2/601. The uid is packed little-endian 0x80000601.
      e6_05_key_recovered_from_flash_dump: validated
      e6_06_key_separation_both_refused: validated
      e6_07_cloned_shared_credential_refused: validated

      # The shared build registers as beacon-development-shared, and the clone
      # (host, no board) extracts the same fleet key and registers a second time
      # under that identifier: two entries under one fingerprint. The clone
      # runs on the host by design; a copied credential does not need the
      # hardware it was copied from.
      shared_identity_registers_and_clone_duplicates_it: validated
      # Remanufacturing: the device erases its key and certificate, a fresh
      # Bootstrap credential is issued, the device generates a new key, and the
      # station issues a new certificate. The old enrollment stands, because
      # the record is append only.
      remanufacturing_issues_fresh_credential_appends_record: validated


      # Tier 5's records coexist with Secure Storage in the one shared settings
      # NVS instance (#118, settles #120). This is the Tier 5 bug Tier 6 found
      # and fixed in its own tree: Tier 5 mounted a second instance on the same
      # partition, which only surfaced once Tier 6 also used it.
      tier5_records_coexist_with_secure_storage: validated
      # Not reached. The full interrupted-download resume has not been re-run
      # on the Tier 6 firmware; only the record coexistence above is a row.
      tier5_download_resume_rerun: not_reached

  tier_07:
    command: [./scripts/verify-tier-00.sh]
    receipt: .course-state/receipts/tier-07.json
    revision_bound: true
    hardware:
      # Issue #230, on the ESP32-C6-DevKitC-1. Claimed as
      # beacon-remfg-206ef1170d64, revoked, remanufactured as
      # beacon-t07-206ef1170d64 and claimed again, over four BOOT presses.
      # The thirteen host bypass rows ran in a fresh Course environment,
      # because this one held synthetic devices an older fixture had stranded;
      # E-7-10 ran here against the claimed board. The Tier 5 image borrowed
      # for the transfer rows cannot mount storage on this board (#239), and
      # identifier_consistent_refused_on_device was repeated in #240: a claim
      # window opened as beacon-t07a-206ef1170d64, the board was erased and
      # re-enrolled as beacon-t07b-206ef1170d64 inside it, and the device half
      # was refused at identifier-consistent naming both.
      # Two defects in the claim path were found on a board in #151, and both
      # were invisible to every host test. The rows below that cover the claim
      # are only honest against firmware that carries both fixes.
      #
      # 1. claim.c read the issued certificate through JSON_TOK_STRING, which
      #    in Zephyr 4.4.2 does not unescape: only JSON_TOK_STRING_BUF does.
      #    The PEM arrived with its newlines still spelled "\n" and
      #    base64_decode refused the backslash.
      # 2. identity.c copied the pending Operational key into its persistent
      #    slot with psa_copy_key() and an unset target policy, believing a
      #    copy inherits the source's. It intersects instead, so the key
      #    landed permitted to do nothing and the first handshake that asked
      #    it to sign failed inside CertificateVerify.

      # The Tier 7 image boots and reads its Factory identity out of Secure
      # Storage, key 0x00000601, rather than trusting the build-time
      # identifier compiled into it.
      tier7_firmware_boots_reads_factory_identity: validated
      # A device holding no Operational certificate opens no connection to a
      # restricted endpoint, says so, and does not fall back to its Factory
      # identity. This is the tier's sharpest line and the board draws it.
      unclaimed_device_refuses_restricted_endpoints: validated
      # The physical act generates: a ten second BOOT hold produces a volatile
      # P-256 key in RAM, a certification request, and a 24 character
      # Crockford base32 nonce in six groups of four, printed immediately.
      boot_hold_opens_claim_window_generates_key_prints_nonce: validated
      # The device half reaches the mutual-TLS listener presenting the Factory
      # certificate signed by PSA key 0x00000601, and polls on a fresh
      # connection every five seconds.
      device_half_reaches_mutual_tls_on_factory_certificate: validated

      # E-7-01. The whole claim, both halves, on the board: BOOT hold, nonce
      # read off the console, operator approval carrying an Owner credential
      # on the server-authenticated listener, and the certificate stored. The
      # pending key is copied into persistent slot 0x00000701 and the
      # certificate into settings.
      e7_01_claim_completes_certificate_stored: validated
      # The stored Operational identity survives a reboot: after a reset the
      # board reads it back out of Secure Storage, prints its fingerprint and
      # owner, and signs a fresh handshake with key 0x00000701.
      operational_identity_survives_reboot: validated
      # E-7-02. The device reaches the restricted endpoints on its Operational
      # identity: it fetches its assignment and the service records a
      # status.observed whose accepted_from is client_certificate, with
      # certificate_device_id, path_device_id and accepted_device_id all
      # agreeing. That agreement is the property the tier exists to show.
      e7_02_assignment_and_status_event_on_operational_identity: validated
      # A whole signed image crosses the opaque-key socket: fetched over mutual
      # TLS on the Operational identity, hashed back out of the secondary
      # slot, and matching the signed digest. The service records
      # update.installed with accepted_from client_certificate.
      #
      # A second release needs no second Tier 7 variant. The device compares
      # only release_id against its own (ota_client.c, the already-confirmed
      # control), so any release the board is not running is downloadable.
      # The board must be on Tier 7 to hold an Operational identity at all, so
      # the only image it can be offered is an earlier tier's: within a tier
      # this course can never demonstrate an OTA update, and every OTA it does
      # demonstrate crosses a tier boundary. tier-05-fail-health suits it
      # because it returns the board to itself.
      e7_02_image_body_transferred_over_mutual_tls: validated
      # The two hard cases in the poll implementation, counted over a real
      # image rather than #158's 64 KiB spike: polls forwarded, polls answered
      # from plaintext mbedTLS already held, and partial records.
      opaque_socket_poll_cases_counted_over_a_full_image: validated
      # The interrupted-download resume, re-run on the Tier 7 stack, which is
      # a different question from Tier 5's because the socket underneath it is
      # this tier's own. ./course device reset interrupts the download, the
      # next poll reads its progress record and sends a Range request, and the
      # download completes; the device refuses anything but 206 Partial
      # Content once it is resuming, so completion is the evidence the range
      # response was honoured. The digest is taken by reading the slot back,
      # so both halves are verified as one image.
      tier5_download_resume_rerun_on_tier7_stack: validated
      # The full Tier 5 recovery cycle on the Tier 7 stack: TEST swap, trial
      # boot, health gate refused at update-client-ready, and MCUboot putting
      # the confirmed Tier 7 image back without being asked. The board ends
      # where it started, with the same identity and no remanufacture.
      trial_revert_to_tier7_after_failed_health_gate: validated
      # The Operational identity survives image swaps and reverts: the board
      # reads back its device_id, Factory key 0x00000601, Operational key
      # 0x00000701 and owner, and signs fresh handshakes with it. The Tier 5
      # trial image mounts its own three sector NVS instance on the storage
      # partition that Tiers 6 and 7 share with PSA Secure Storage as eight
      # sectors, which is the #118/#120 hazard exercised live.
      operational_identity_survives_image_swap_and_revert: validated
      # Fixed by #175. Nothing cleared the trial record after a revert, so
      # main.c reported one from that stale record on every subsequent boot.
      # The record could not simply be cleared: the same count is the bound
      # that stops a revert loop, so it now carries a reported flag instead.
      # After the fix the board boots to "recovery.state trial no release is
      # being tried" and queues nothing, including when it reads a trial
      # record a Tier 5 image genuinely wrote with reported=yes.
      stale_trial_record_reports_a_revert_on_every_boot: fixed_and_validated
      # The Tier 5 trial image queues its own update.reverted, naming
      # tier-05-fail-health and update-client-ready, and cannot deliver it:
      # it holds no Operational identity, and the device listener refuses it.
      # The tier's restriction read from the other side, on the board.
      tier5_trial_image_cannot_report_over_mutual_tls: pending

      # Section 11 bypass rows. Thirteen of the fifteen are host runners by
      # design and say so in their own output; E-7-01 and E-7-02 above are the
      # two the board earns. Five of the thirteen are "host, board required":
      # the refusal is read on the host, and a board is what makes the row
      # possible. E-7-10 is the clearest case, forging against the claim the
      # Learner's own board holds.
      e7_03_factory_certificate_at_download_refused: validated
      e7_04_operational_certificate_at_claim_refused: validated
      e7_05_expired_certificate_refused: validated
      e7_06_revoked_certificate_refused: validated
      e7_07_never_issued_certificate_refused: validated
      e7_08_forged_serial_unclaimed_device_refused: validated
      e7_09_identifier_mismatch_refused: validated
      e7_10_ownership_context_refused: validated
      e7_11_replayed_nonce_refused: validated
      e7_12_closed_window_refused: validated
      e7_13_wrong_nonce_refused: validated
      e7_14_already_claimed_device_refused: validated
      e7_15_foreign_issuer_handshake_closed: validated

      # Not on any row's list: a claim window opened before a remanufacture
      # submits a request naming the old identifier while the Factory
      # certificate names the new one, and the service refuses it at
      # identifier-consistent with both names in the reason.
      identifier_consistent_refused_on_device: validated

      # Not checked. The board can be asked to export its Factory key, which
      # is E-6-04, but no command asks it to export the Operational key, so
      # the non-exportability the console claims for key 0x00000701 has no
      # device witness. It holds by construction twice over, from the usage
      # flags named in the copy and from the intersection with a source that
      # never had PSA_KEY_USAGE_EXPORT, but construction is not observation.
      operational_key_export_refused_on_device: not_checked_no_command
      # Not reached. E-6-04 has not been re-run against the Tier 7 image; it
      # needs the provisioning shell open, which is another physical hold.
      e6_04_export_refusal_rerun_on_tier7_image: not_reached

      # The rows the Tier 7 module's quoted console output rests on. The
      # module quotes a claim succeeding end to end, and ownership is first
      # come, so a board that has already been claimed must be remanufactured
      # to a fresh Factory identity first. Every identity is an appended
      # record and nothing is rewritten.

      # The whole claim again, both halves, driven by the ./course claim
      # approve command rather than by hand: BOOT hold, volatile pending key,
      # certification request, 24 character nonce, operator approval carrying
      # an Owner credential on the operator listener, and the certificate
      # copied into persistent slot 0x00000701.
      e7_01_claim_completes_through_the_claim_approve_command: validated
      # E-7-02 again on the new identity: the service records status.observed
      # with accepted_from client_certificate and certificate_device_id,
      # path_device_id and accepted_device_id all naming it.
      e7_02_status_event_on_operational_identity_after_remanufacture: validated
      # An erased board refuses to open a restricted connection and says so,
      # observed after the erase rather than inherited from an earlier run.
      unclaimed_device_refuses_restricted_endpoints_after_erase: validated
      # E-7-14 witnessed by the board rather than by the fixture. A press on a
      # still-claimed identity generates a pending key and a nonce, the
      # Learner's own owner approves it, and the service refuses at
      # device-unowned without touching the issued identity. The fixture's
      # own E-7-14 uses a synthetic device; this one uses the board.
      e7_14_device_unowned_refused_on_the_board: validated
      # The operator half arriving before the device half is refused at
      # claim-window-open, which is the ordering #135 specifies. It is in the
      # module's troubleshooting table for that reason.
      operator_half_before_device_half_refused_on_the_board: validated
      # E-7-06 witnessed by the board. ./course claim revoke marks the board's
      # own Operational certificate revoked and the board is refused at
      # certificate-active on its next request. The board's account of that
      # refusal is the module's prepared Mentor failure, because it is
      # genuinely misleading: the handshake succeeds and says so, and the
      # assignment path never reads the 403 before parsing, so a correct
      # authorization decision reaches the console as
      # "ota.assignment missing release_id or image_path". Removing the
      # revocation lets the board reach the service on its Operational
      # identity again.
      e7_06_revoked_certificate_refused_on_the_board: validated

