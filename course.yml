    - id: claim-record
      template: evidence/templates/tier-01/claim-record.md
      format: markdown
      learner_path: evidence/learner/tier-01/claim-record.md
    - id: mentor-review-record
      template: evidence/templates/tier-01/mentor-review-record.md
      format: markdown
      learner_path: evidence/learner/tier-01/mentor-review-record.md
  tier_02:
    - id: packet-evidence
      template: evidence/templates/tier-02/packet-evidence.md
      format: markdown
      learner_path: evidence/learner/tier-02/packet-evidence.md
    - id: certificate-validation-tests
      template: evidence/templates/tier-02/certificate-validation-tests.md
      format: markdown
      learner_path: evidence/learner/tier-02/certificate-validation-tests.md
