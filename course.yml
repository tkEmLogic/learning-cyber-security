    complete_checkpoint: course-v1.0-tier-04-complete
    module: course-material/tiers/tier-04-release-policy/index.md
    prerequisites: ["03"]
  "05":
    title: Make installation recoverable
    kind: control
    track: core
    status: planned
    start_checkpoint: course-v1.0-tier-04-complete
    complete_checkpoint: course-v1.0-tier-05-complete
    module: course-material/tiers/tier-05-recovery/index.md
    prerequisites: ["04"]
  "06":
    title: Replace shared identity with per-device factory identity
    kind: lifecycle
    track: core
    status: planned
    start_checkpoint: course-v1.0-tier-05-complete
    complete_checkpoint: course-v1.0-tier-06-complete
    module: course-material/tiers/tier-06-factory-identity/index.md
    prerequisites: ["05"]
  "07":
    title: Add owner-scoped operational identity and mutual TLS
    kind: lifecycle
    track: core
