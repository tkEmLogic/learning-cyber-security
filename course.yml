schema_version: 1

course:
  id: learning-cyber-security
  version: "1.0"
  minimum_wrapper_version: "1.0.0"
  environment_marker_ttl_hours: 24

runtime:
  bind_default: 127.0.0.1
  private_bind_allowed: true
  ota_port: 8080
  ota_tls_port: 8443
  impersonation_port: 18080
  impersonation_tls_port: 18443
  service_name: ota.course.example

paths:
  state: .course-state
  secrets: .course-secrets
  build: build
  generated_artifacts: artifacts/generated
  learner_evidence: evidence/learner
  cleanup_allowlist:
    - .course-state
    - .course-secrets
    - build
    - artifacts/generated

components:
  course_helper:
    path: tools/course
    build: [go, build, ./tools/course]
  ota_service:
    path: services/ota
    build: [go, build, ./services/ota/cmd/ota]
  firmware:
    path: firmware/reference-product-baseline
    build: [./course, build, firmware]
    target: esp32c6_devkitc/esp32c6/hpcore
    zephyr: 4.4.2
    mcuboot: 2.4.0
    image_mode: unsigned
    upgrade_mode: swap_using_offset
    variants:
      baseline:
        release_id: tier-00-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-00-baseline.bin
      altered:
        release_id: tier-00-altered
        beacon_state: fast
        image: artifacts/generated/releases/tier-00-altered.bin
      tier-02-baseline:
        release_id: tier-02-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-02-baseline.bin
        app: firmware/tier-02-authenticated-service
      tier-03-baseline:
        release_id: tier-03-baseline
        beacon_state: steady
        image: artifacts/generated/releases/tier-03-baseline.bin
        app: firmware/tier-03-signed-images
        # From Tier 3 the bootloader checks who published an image. The
        # component level image_mode above describes Tier 0 and Tier 2, which
        # do not, and it stays true of them.
        image_mode: signed_ecdsa_p256
        # Only the public half is ever a build input, and this is it. The
        # Release signing key is deliberately absent from this manifest: it is
        # named by ./course release sign and by nothing else.
        public_key: artifacts/generated/signing/release.pub.pem

services:
  ota:
    protocol: http
    bind: 0.0.0.0
    port: 8080
    health: /health
    marker: /.well-known/course-environment
    state_path: .course-state/ota
    release_path: artifacts/generated/releases
  impersonation:
    protocol: http
    bind: 127.0.0.1
    port: 18080
    lifecycle: fixture-scoped

devices:
  reference_beacon:
    synthetic_id: beacon-development-shared
    spoof_id: beacon-development-clone
    board: esp32c6_devkitc/esp32c6/hpcore
    stable_serial_prefix: /dev/serial/by-id/
    states:
      steady: normal
      fast: fictional_error_1
      slow: fictional_error_2
    hardware_required:
      - flash
      - logs
      - update
      - recover

fixtures:
  tier-00/plaintext-inspection:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: HTTP release fields and firmware bytes are readable.
    changes:
      - artifacts/generated/attacks/tier-00/plaintext-inspection
    reset: ./course attack reset tier-00/plaintext-inspection
    hardware_required: false
  tier-00/device-id-spoofing:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The service accepts a status body that names the second synthetic device.
    changes:
      - .course-state/ota/events.jsonl
      - artifacts/generated/attacks/tier-00/device-id-spoofing
    reset: ./course attack reset tier-00/device-id-spoofing
    hardware_required: false
  tier-00/service-impersonation:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: Generated device configuration accepts a marker-matching HTTP impersonation service.
    changes:
      - .course-state/device-config.json
      - artifacts/generated/attacks/tier-00/service-impersonation
    reset: ./course attack reset tier-00/service-impersonation
    hardware_required: false
  tier-00/altered-image:
    tier: "00"
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The service delivers the manifest-owned altered unsigned image. An attached device installs and runs it.
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/releases/tier-00-altered.bin
      - artifacts/generated/attacks/tier-00/altered-image
    reset: ./course attack reset tier-00/altered-image
    reset_keeps_built_image: true
    hardware_required: true
  tier-03/hostile-image:
    tier: "03"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service publishes a manifest-owned hostile image and delivers it unchanged. What the device does with it is not known to the fixture.
    images:
      unsigned: tier-03-hostile-unsigned.bin
      modified: tier-03-hostile-modified.bin
      wrong-key: tier-03-hostile-wrong-key.bin
      truncated: tier-03-hostile-truncated.bin
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-03/hostile-image
    reset: ./course attack reset tier-03/hostile-image
    reset_keeps_built_image: true
    hardware_required: true
  # Tier 4 publishes hostile release metadata, not hostile firmware. All six
  # variants point at the Learner's own good image; what is wrong with them is
  # the signed description of it, so the selector names a release rather than a
  # file. See docs/fixture-safety-contract.md, "Tier 4 fixtures".
  tier-04/hostile-release:
    tier: "04"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service publishes a manifest-owned hostile Release manifest and serves it and its detached signature back unchanged. What the device does with it is not known to the fixture.
    releases:
      modified: tier-04-hostile-modified
      wrong-key: tier-04-hostile-wrong-key
      hardware: tier-04-hostile-hardware
      channel: tier-04-hostile-channel
      size: tier-04-hostile-size
      digest: tier-04-hostile-digest
      counter-mismatch: tier-04-hostile-counter-mismatch
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-04/hostile-release
    reset: ./course attack reset tier-04/hostile-release
    reset_keeps_built_image: true
    hardware_required: true
  # The replay forges nothing, so it has no selector at all. It re-assigns a
  # release this environment produced, chosen by comparing signed security
  # counters, and it never edits a manifest or a signature.
  tier-04/replay-release:
    tier: "04"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: The genuine service re-assigns an older release of its own, unedited and still verifying. What the device does with it is not known to the fixture, and the check is inert unless a counter-carrying image is already in the primary slot.
    changes:
      - .course-state/ota/current-release.json
      - artifacts/generated/attacks/tier-04/replay-release
    reset: ./course attack reset tier-04/replay-release
    reset_keeps_built_image: true
    hardware_required: true
  tier-02/plaintext-inspection:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: Release records left the plain HTTP port and are readable only over a verified connection.
    changes:
      - artifacts/generated/attacks/tier-02/plaintext-inspection
    reset: ./course attack reset tier-02/plaintext-inspection
    hardware_required: false
  tier-02/service-impersonation:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: A certificate for the right name from an untrusted authority is refused.
    changes:
      - .course-state/device-config.json
      - artifacts/generated/attacks/tier-02/service-impersonation
    reset: ./course attack reset tier-02/service-impersonation
    hardware_required: false
  tier-02/name-mismatch:
    tier: "02"
    uses_tls_port: true
    target: http://127.0.0.1:8080
    interface: loopback
    expected_effect: A certificate issued by the trusted authority for another name is refused.
    changes:
      - artifacts/generated/attacks/tier-02/name-mismatch
    reset: ./course attack reset tier-02/name-mismatch
    hardware_required: false

