      learner_path: evidence/learner/tier-00/http-exchange.json
    - id: accepted-image-record
      template: evidence/templates/tier-00/accepted-image-record.json
      schema: evidence/schemas/tier-00-evidence.schema.json
      learner_path: evidence/learner/tier-00/accepted-image-record.json
    - id: absent-controls
      template: evidence/templates/tier-00/absent-controls.json
      schema: evidence/schemas/tier-00-evidence.schema.json
      learner_path: evidence/learner/tier-00/absent-controls.json
  tier_01:
    - id: threat-model-worksheet
      template: evidence/templates/tier-01/threat-model-worksheet.md
