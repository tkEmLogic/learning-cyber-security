    start_checkpoint: course-v1.0-tier-06-complete
    complete_checkpoint: course-v1.0-tier-07-complete
    module: course-material/tiers/tier-07-operational-identity/index.md
    prerequisites: ["06"]
  "08":
    title: Operate the credential lifecycle
    kind: lifecycle
    track: core
    status: planned
    start_checkpoint: course-v1.0-tier-07-complete
    complete_checkpoint: course-v1.0-tier-08-complete
    module: course-material/tiers/tier-08-credential-lifecycle/index.md
    prerequisites: ["07"]
  "09":
    title: Manage dependencies, vulnerabilities, and support
    kind: lifecycle
    track: core
    status: planned
    start_checkpoint: course-v1.0-tier-08-complete
    complete_checkpoint: course-v1.0-tier-09-complete
    module: course-material/tiers/tier-09-vulnerability-support/index.md
    prerequisites: ["08"]
  "10":
    title: Defend the integrated product
    kind: integration
    track: core
    status: planned
    start_checkpoint: course-v1.0-tier-09-complete
    complete_checkpoint: course-v1.0-tier-10-complete
    module: course-material/tiers/tier-10-integrated-defense/index.md
    prerequisites: ["09"]
  "A":
    title: Add ESP32-C6 hardware-rooted security
    kind: control
    track: advanced
    status: planned
    start_checkpoint: course-v1.0-tier-10-complete
    complete_checkpoint: course-v1.0-tier-A-complete
